<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph -->

    <meta property="og:description" content="查看好友分享的旅行路线，一键导入你的 PopMap">
    <meta property="og:image" content="./screenshot.png">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PopMap · 共享行程">
    <meta name="twitter:description" content="查看好友分享的旅行路线，一键导入你的 PopMap">
    <meta name="twitter:image" content="https://q1ngshi.github.io/popmap/screenshot.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f5e6 0%, #f0ebd8 100%);
            min-height: 100vh;
            color: #3a2a1a;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 253, 248, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(196, 129, 58, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 200px; height: 200px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="%23c4813a" opacity="0.05"/></svg>');
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0d5c0;
        }
        .logo {
            font-size: 32px;
            margin-right: 15px;
        }
        h1 {
            font-size: 28px;
            color: #3a2a1a;
            font-weight: 700;
        }
        .subtitle {
            color: #8a7a6a;
            font-size: 16px;
            margin-top: 5px;
        }
        .trip-info {
            background: #fffaf0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #e0d5c0;
        }
        .trip-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #8a7a6a;
        }
        .trip-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .trip-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .day-group {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #c4813a;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }
        .day-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .day-badge {
            background: #c4813a;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-right: 10px;
        }
        .day-title {
            font-size: 16px;
            font-weight: 600;
            color: #3a2a1a;
        }
        .poi-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0ebd8;
        }
        .poi-item:last-child {
            border-bottom: none;
        }
        .poi-index {
            background: #f8f5e6;
            color: #c4813a;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-right: 12px;
        }
        .poi-content {
            flex: 1;
        }
        .poi-name {
            font-weight: 600;
            color: #3a2a1a;
            font-size: 16px;
        }
        .poi-city {
            color: #8a7a6a;
            font-size: 13px;
            margin-top: 2px;
        }
        .poi-meta {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            font-size: 12px;
            color: #b0a090;
        }
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0d5c0;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: #c4813a;
            color: white;
        }
        .btn-primary:hover {
            background: #b3712a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(196, 129, 58, 0.3);
        }
        .btn-secondary {
            background: white;
            color: #3a2a1a;
            border: 2px solid #e0d5c0;
        }
        .btn-secondary:hover {
            border-color: #c4813a;
            color: #c4813a;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #b0a090;
            font-size: 13px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #8a7a6a;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #d9534f;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .trip-meta { flex-direction: column; gap: 10px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌍</div>
            <div>
                <h1>PopMap 行程分享</h1>
                <div class="subtitle">手绘风格 3D 地球旅行规划工具</div>
            </div>
        </div>

        <div id="content">
            <div class="loading">正在加载行程数据...</div>
        </div>

        <div class="footer">
            Made with ❤️ by PopMap · 分享链接有效期 30 天
        </div>
    </div>

    <!-- LZString 压缩库 -->
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script>
        function parseShareData() {
            const urlParams = new URLSearchParams(window.location.search);
            let shareData = urlParams.get('d');   // v2 LZString
            const legacyData = urlParams.get('share');  // v1 Base64
            
            if (!shareData && !legacyData) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h3>未找到分享数据</h3>
                        <p>请检查链接是否正确，或联系分享者重新生成链接。</p>
                    </div>
                `;
                return;
            }

            try {
                let decoded;
                if (shareData) {
                    // v2: LZString 压缩格式
                    if (typeof LZString !== 'undefined') {
                        const json = LZString.decompressFromEncodedURIComponent(shareData);
                        decoded = JSON.parse(json);
                    } else {
                        decoded = JSON.parse(decodeURIComponent(escape(atob(shareData))));
                    }
                } else if (legacyData) {
                    decoded = JSON.parse(atob(legacyData));
                }
                
                let trip;
                if (decoded.v === 2 && Array.isArray(decoded.t)) {
                    trip = decoded.t.map(p => ({
                        name: p.n,
                        city: p.c,
                        lng: p.g,
                        lat: p.a,
                        rating: p.r,
                        hours: p.h,
                        ticket: p.k
                    }));
                } else if (decoded.version === 'popmap-v1' && Array.isArray(decoded.trip)) {
                    trip = decoded.trip;
                } else {
                    throw new Error('数据格式错误');
                }
                const perDay = 3;
                const days = [];
                for (let i = 0; i < trip.length; i += perDay) {
                    days.push(trip.slice(i, i + perDay));
                }

                const totalDistance = trip.length > 1 ? calculateTotalDistance(trip) : 0;
                const totalTime = totalDistance > 0 ? (totalDistance / 60).toFixed(1) : 0;

                document.getElementById('content').innerHTML = `
                    <div class="trip-info">
                        <div class="trip-meta">
                            <span>📌 ${trip.length} 个地点</span>
                            <span>🗓️ ${days.length} 天行程</span>
                            ${totalDistance > 0 ? `<span>📏 约 ${totalDistance.toFixed(1)} km</span>` : ''}
                            ${totalTime > 0 ? `<span>⏱️ 约 ${totalTime} 小时</span>` : ''}
                            <span>🕐 ${new Date(decoded.timestamp || decoded.ts).toLocaleDateString('zh-CN')}</span>
                        </div>
                        <div class="trip-list">
                            ${days.map((dayPois, dayIndex) => `
                                <div class="day-group">
                                    <div class="day-header">
                                        <span class="day-badge">Day ${dayIndex + 1}</span>
                                        <span class="day-title">${dayPois.length} 个地点</span>
                                    </div>
                                    ${dayPois.map((poi, poiIndex) => `
                                        <div class="poi-item">
                                            <div class="poi-index">${poiIndex + 1}</div>
                                            <div class="poi-content">
                                                <div class="poi-name">${poi.name}</div>
                                                <div class="poi-city">${poi.city || '未知城市'}</div>
                                                <div class="poi-meta">
                                                    <span>⭐ ${poi.rating || '4.0'}</span>
                                                    <span>🕐 ${poi.hours || '暂无'}</span>
                                                    <span>🎫 ${poi.ticket || '暂无'}</span>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-primary" onclick="openInPopMap()">
                            🌍 在 PopMap 中打开
                        </button>
                        <button class="btn btn-secondary" onclick="copyLink()">
                            📋 复制链接
                        </button>
                    </div>
                `;
            } catch (error) {
                console.error('解析失败:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h3>行程数据解析失败</h3>
                        <p>请检查链接是否正确，或联系分享者重新生成链接。</p>
                    </div>
                `;
            }
        }

        function calculateTotalDistance(trip) {
            // 简化版距离计算
            let total = 0;
            for (let i = 0; i < trip.length - 1; i++) {
                const p1 = trip[i], p2 = trip[i + 1];
                const R = 6371;
                const dLat = (p2.lat - p1.lat) * Math.PI / 180;
                const dLng = (p2.lng - p1.lng) * Math.PI / 180;
                const a = Math.sin(dLat/2)**2 + Math.cos(p1.lat*Math.PI/180) * Math.cos(p2.lat*Math.PI/180) * Math.sin(dLng/2)**2;
                total += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            }
            return total;
        }

        function openInPopMap() {
            const currentUrl = window.location.href;
            const popmapUrl = currentUrl.replace('share.html', 'index.html');
            window.open(popmapUrl, '_blank');
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('链接已复制到剪贴板');
            }).catch(() => {
                const tempInput = document.createElement('input');
                tempInput.value = window.location.href;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                alert('链接已复制到剪贴板');
            });
        }

        // 页面加载完成后解析
        document.addEventListener('DOMContentLoaded', parseShareData);
    </script>
</body>
</html>
